<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Sidewalk Stories LA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            background-color: var(--color-concrete-bg);
            position: relative;
            overflow: hidden;
        }
        .error-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(45deg, var(--color-mosaic-1) 25%, transparent 25%),
                linear-gradient(-45deg, var(--color-mosaic-2) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--color-mosaic-3) 75%),
                linear-gradient(-45deg, transparent 75%, var(--color-mosaic-4) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            opacity: 0.06;
        }
        .error-content {
            position: relative;
            z-index: 1;
        }
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--color-mosaic-1), var(--color-mosaic-2), var(--color-mosaic-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
        }
        .error-content h1 {
            margin-bottom: 16px;
        }
        .error-content p {
            color: var(--color-text-light);
            margin-bottom: 36px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <span class="logo-icon"></span>
                Sidewalk Stories LA
            </a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu">
                <li><a href="about.html">About</a></li>
                <li><a href="program.html">Our Program</a></li>
                <li><a href="contact.html">Get Involved</a></li>
                <li><a href="contact.html#donate" class="btn btn-primary">Donate</a></li>
            </ul>
        </div>
    </nav>

    <section class="error-section">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1>Page Not Found</h1>
            <p>This panel has not been repaired yet. But do not worry, we are working on it.</p>
            <a href="index.html" class="btn btn-primary btn-large">Back to Home</a>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>

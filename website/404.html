    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 24px 80px;
            background-color: var(--color-concrete-bg);
            position: relative;
            overflow: hidden;
        }
        .error-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(45deg, var(--color-mosaic-1) 25%, transparent 25%),
                linear-gradient(-45deg, var(--color-mosaic-2) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--color-mosaic-3) 75%),
                linear-gradient(-45deg, transparent 75%, var(--color-mosaic-4) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            opacity: 0.06;
        }
        .error-content {
            position: relative;
            z-index: 1;
        }
        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--color-mosaic-1), var(--color-mosaic-2), var(--color-mosaic-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
        }
        .error-content h1 {
            margin-bottom: 16px;
        }
        .error-content p {
            color: var(--color-text-light);
            margin-bottom: 36px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>

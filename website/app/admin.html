<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin | Sidewalk Stories LA</title>
<meta name="theme-color" content="#2C5F8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/jpeg" href="../images/logo-signature.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">
<header class="app-top">
<a class="app-brand" href="index.html"><img src="../images/logo-signature.jpg" alt=""> Panel App</a>
<nav class="app-nav">
<a href="index.html" data-nav="map">Map</a>
<a href="report.html" data-nav="report">Report</a>
<a href="admin.html" data-nav="admin" class="active">Admin</a>
<a href="../report-panel.html">Site form</a>
</nav>
</header>
<main class="app-main">
<div class="card" id="gate-card">
<h1>Admin triage</h1>
<p class="muted">PIN unlocks this browser session only. Default PIN is in js/panel-config.js (change it).</p>
<label for="pin">Admin PIN</label>
<input id="pin" type="password" autocomplete="current-password">
<button class="btn btn-navy" type="button" id="btn-unlock">Unlock</button>
<div class="status" id="gate-status"></div>
</div>
<div id="admin-app" style="display:none">
<div class="card">
<h1>Panel queue</h1>
<div class="filters">
<select id="filter-status"><option value="all">All statuses</option><option value="new">new</option><option value="reviewed">reviewed</option><option value="shortlist">shortlist</option><option value="selected">selected</option><option value="rejected">rejected</option></select>
<button class="btn btn-ghost" type="button" id="btn-export-json">Export JSON</button>
<button class="btn btn-ghost" type="button" id="btn-export-csv">Export CSV</button>
<button class="btn btn-ghost" type="button" id="btn-refresh">Refresh</button>
</div>
<p class="muted" id="admin-count"></p>
<div id="admin-map"></div>
</div>
<div class="card"><h2>Reports</h2><div id="admin-list"></div></div>
</div>
</main>
<footer class="app-footer">Sidewalk Stories LA - own the sidewalk reporter</footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="../js/panel-config.js"></script>
<script src="../js/panel-store.js"></script>
<script src="js/app-common.js"></script>
<script src="js/admin.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
</html>
